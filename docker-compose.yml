version: '3'

services:

  backend:

    build: ./backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

  booking-worker:

    build: ./backend

    command: npm run worker

    env_file:
      - ./backend/.env

    depends_on:
      - backend

  frontend:

    build: ./frontend

    ports:
      - "3000:3000"

    depends_on:
      - backend